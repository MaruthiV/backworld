[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backworld"
version = "0.1.0"
description = "Finite environment calculations for policy-gradient research"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "torch==2.6.0"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
